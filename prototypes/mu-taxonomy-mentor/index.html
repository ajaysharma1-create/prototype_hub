<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="MU Taxonomy — Mentor Side. What the taxonomy change does to a mentor's own profile, and how they review and update it.">
  <title>Your expertise profile · MentorUnion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <!-- Classic scripts, not modules: a page opened from the file system has
       origin `null`, and module scripts are blocked by CORS there. `defer`
       keeps them in document order and runs them after parsing.

       taxonomy.js and icons.js are byte-for-byte the mentee-side prototype's
       files (live/mu_taxonomy_filters/prototype). The mentor side reads the
       same taxonomy the mentee side filters on; a second copy that could drift
       would be a second taxonomy. -->
  <script src="icons.js" defer></script>
  <script src="taxonomy.js" defer></script>
  <script src="mentor-profile.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#screen">Skip to content</a>

  <header class="topbar">
    <img class="topbar__logo" src="assets/logo-on-dark.svg" alt="MentorUnion" width="100" height="27">
    <div class="topbar__role">
      <img class="topbar__avatar" src="assets/mentor-portrait.png" alt="" width="28" height="28">
      <span id="topbar-name">Mentor</span>
    </div>
  </header>

  <main class="page" id="screen" tabindex="-1"></main>
</body>
</html>
