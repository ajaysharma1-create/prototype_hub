<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="All Mentors — mentor discovery filtered by session agenda, industry, functional domain and expertise, built on the proposed MentorUnion taxonomy.">
  <title>All Mentors · MentorUnion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <!-- Classic scripts, not modules: a page opened from the file system has
       origin `null`, and module scripts are blocked by CORS there. `defer`
       keeps them in document order and runs them after parsing.
       mentors-varied.js provides the twelve illustrative mentor records used
       to review the discovery and filtering experience. -->
  <script src="icons.js" defer></script>
  <script src="taxonomy.js" defer></script>
  <script src="mentors-varied.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#results">Skip to mentor results</a>

  <!-- Compact navigation rail: icon over label, permanently visible, no drawer.
       Below 768px it is replaced by the bottom tab bar at the end of the page.
       Only "Mentors" resolves to a page in this prototype; the rest are the
       platform's other sections, kept so the frame reads true. -->
  <nav class="rail" id="rail" aria-label="Platform sections">
    <span class="rail__mark" aria-hidden="true"></span>
    <div class="rail__group" id="rail-main"></div>
    <div class="rail__group rail__group--foot" id="rail-foot"></div>
  </nav>

  <div class="shell">
    <header class="topbar">
      <img class="topbar__logo" src="assets/logo-on-dark.svg" alt="MentorUnion" width="100" height="27">

      <div class="topbar__actions">
        <button class="chip-control" type="button" aria-label="Region: India">
          <img class="chip-control__flag" src="assets/flag-in.png" alt="" width="30" height="30">
          <span data-icon="chevron-down" data-size="16"></span>
        </button>

        <button class="chip-control chip-control--credits" type="button">
          <span data-icon="stack" data-size="15"></span>
          <span><span id="credit-count">1</span> Credit(s)</span>
        </button>

        <button class="topbar__bell" type="button" aria-label="Notifications" data-icon="bell" data-size="20"></button>
      </div>
    </header>

    <main class="page">
      <div class="page__head">
        <h1 class="page__title">All Mentors</h1>

        <div class="search" id="search" role="search">
          <span data-icon="search" data-size="20"></span>
          <label class="sr-only" for="search-input">Search mentors</label>
          <input id="search-input" type="search" autocomplete="off" spellcheck="false"
                 enterkeyhint="search" aria-controls="grid"
                 placeholder="Search mentors, industries, domains and more...">
          <button class="search__clear" type="button" aria-label="Clear search" data-icon="x" data-size="16"></button>
        </div>
      </div>

      <!-- Agendas — the quick-selection layer. All thirteen values stay in one
           horizontally scrollable row. -->
      <section class="quick" aria-labelledby="quick-title">
        <h2 class="quick__title" id="quick-title">Quick filters</h2>
        <div class="quick__viewport">
          <button class="quick__nav quick__nav--prev" type="button" aria-label="Previous quick filters"
                  data-agenda-scroll="-1" disabled>
            <span data-icon="chevron-down" data-size="16"></span>
          </button>
          <div class="quick__list" id="agenda-list" role="group" aria-labelledby="quick-title" tabindex="0"></div>
          <button class="quick__nav quick__nav--next" type="button" aria-label="Next quick filters"
                  data-agenda-scroll="1" disabled>
            <span data-icon="chevron-down" data-size="16"></span>
          </button>
        </div>
      </section>

      <!-- Results controls. Left: which mentors are in the set. Right: how that
           same set is presented — view first, then order. All three controls
           share the 40px height the search field and the schema Dropdown use. -->
      <div class="toolbar">
        <button class="toolbar__filters" type="button" data-sheet-open
                aria-haspopup="dialog" aria-expanded="false" aria-controls="filter-sheet">
          <span data-icon="adjustments-horizontal" data-size="16"></span>
          <span>Filters</span>
          <span class="toolbar__badge" id="filters-badge" hidden></span>
        </button>

        <!-- Grid/List. Same aria-pressed segmented pattern as the per-card
             Domain/Expertise toggle, sized for the toolbar. -->
        <div class="toolbar__views" id="toolbar-views" role="group" aria-label="Result layout"></div>

        <div class="toolbar__sort" id="toolbar-sort"></div>
      </div>

      <!-- The active taxonomy path, shown as a funnel rather than loose chips. -->
      <div class="funnel" id="funnel" aria-live="polite"></div>

      <section class="results" id="results" aria-label="Mentors" tabindex="-1">
        <div class="grid" id="grid"></div>
      </section>
    </main>
  </div>

  <!-- Mobile navigation: the same destinations as the rail, as a bottom tab bar.
       The four sections a mentee moves between, plus everything else under More. -->
  <nav class="tabbar" id="tabbar" aria-label="Platform sections"></nav>

  <dialog class="msheet" id="more-nav" aria-label="More sections">
    <div class="msheet__head">
      <h2>More</h2>
      <button class="msheet__close" type="button" aria-label="Close" data-icon="x" data-size="20" data-more-nav-close></button>
    </div>
    <div class="msheet__body" id="more-nav-body"></div>
  </dialog>

  <!-- Advanced filters. A persistent split-panel workspace on laptop and
       desktop, with the same primary categories in a sticky strip on mobile. -->
  <dialog class="fsheet" id="filter-sheet" aria-labelledby="fsheet-title">
    <div class="fsheet__head">
      <h2 id="fsheet-title">Filters</h2>
      <button class="fsheet__reset" type="button" data-clear-all>Reset all</button>
      <button class="fsheet__close" type="button" aria-label="Close filters" data-icon="x" data-size="20" data-sheet-close></button>
    </div>
    <div class="fsheet__main">
      <nav class="fsheet__stages" id="fsheet-stages" role="tablist" aria-label="Filter categories"></nav>
      <section class="fsheet__workspace" id="fsheet-workspace">
        <div class="fsheet__body" id="fsheet-body" role="tabpanel"></div>
      </section>
    </div>
    <div class="fsheet__foot">
      <button class="fsheet__clear" type="button" data-clear-all>Clear all</button>
      <button class="fsheet__done" type="button" data-sheet-close>Show mentors</button>
    </div>
  </dialog>

  <dialog class="sheet" id="booking">
    <div class="sheet__head">
      <div>
        <h2 id="booking-name">Schedule a Call</h2>
        <p id="booking-role"></p>
      </div>
      <button class="sheet__close" type="button" aria-label="Close" data-icon="x" data-size="20" data-close></button>
    </div>
    <div class="sheet__body">
      <dl>
        <dt>Next available</dt><dd id="booking-slot"></dd>
        <dt>Time zone</dt><dd id="booking-tz"></dd>
        <dt>Session cost</dt><dd id="booking-cost"></dd>
      </dl>
      <button class="sheet__cta" type="button" id="booking-confirm">Confirm and use 1 credit</button>
    </div>
  </dialog>
</body>
</html>
