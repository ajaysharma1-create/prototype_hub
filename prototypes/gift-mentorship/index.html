<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Gift a Career - give someone time with mentors who have already made the move they are making. Choose a gift, personalise it, and schedule when it arrives.">
  <title>Gift a Career · MentorUnion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header">
    <!-- The collapsed state is the stylesheet's default below 64rem; JS only ever
         sets data-menu="open". The menu is therefore shut on mobile and tablet
         before app.js runs, and stays shut if it never does. -->
    <div class="nav-inner" data-menu="closed">
      <a class="brand" href="#/" aria-label="MentorUnion home">
        <img src="assets/logos/mentor-union-logo.png"
             width="376" height="111" alt="">
      </a>

      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav"
              aria-label="Open menu" data-action="toggle-menu">
        <span class="menu-toggle__bars" aria-hidden="true"></span>
      </button>

      <nav class="nav-links" id="primary-nav" aria-label="Primary navigation">
        <a class="nav-link" href="#/" data-nav="institutions" data-inert-nav>For Institutions</a>
        <a class="nav-link" href="#/" data-nav="individuals" data-inert-nav>Student &amp; Professional</a>
        <a class="nav-link" href="#/" data-nav="pricing" data-inert-nav>Pricing</a>
        <a class="nav-link" href="#/gift" data-nav="gift">Gift a Career</a>
        <!-- The way into the signed-in platform. Sign-up itself is out of scope,
             so this stands in for it: pressing it puts you inside the product,
             which is where a gift is claimed. -->
        <a class="nav-cta" href="#/app" data-nav="signup">Signup</a>
      </nav>
    </div>
  </header>

  <main class="page-main" id="main-content" tabindex="-1">
    <!-- The signed-in platform shell. Structure is the All Mentors dashboard
         from live/mentee-direct-onboarding/prototype: a fixed icon rail, then
         a main column whose topbar carries the page title on the left and its
         actions on the right. It is static markup, not re-rendered per route,
         so "Claim your Gift" is genuinely persistent across every platform
         page rather than belonging to one of them.

         app.js moves #app into .plat-view on platform routes and back into
         this main element on website routes, so there is still exactly one
         mount point and one of the two shells is ever on screen. -->
    <div class="plat-shell" id="plat-shell" hidden>
      <nav class="plat-rail" aria-label="Platform sections">
        <a class="plat-rail__ico" href="#/" aria-label="Home">
          <span class="plat-rail__tile">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 10.2 12 3l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>
            </svg>
          </span>
        </a>
        <button class="plat-rail__ico" type="button" data-inert-nav aria-label="Sessions">
          <span class="plat-rail__tile">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15.5 10.5 21 7v10l-5.5-3.5Z"/><rect x="3" y="6" width="12.5" height="12" rx="2"/>
            </svg>
          </span>
        </button>
        <button class="plat-rail__ico" type="button" data-inert-nav aria-label="Mentors">
          <span class="plat-rail__tile">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="9" cy="8" r="3.4"/><path d="M2.6 20a6.4 6.4 0 0 1 12.8 0"/>
              <path d="M16.4 5.2a3.4 3.4 0 0 1 0 5.6M18 14.4A6.4 6.4 0 0 1 21.4 20"/>
            </svg>
          </span>
        </button>
        <a class="plat-rail__ico" href="#/app" data-app-nav="app" aria-label="Your credits">
          <span class="plat-rail__tile">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <ellipse cx="12" cy="6.2" rx="8" ry="3.2"/><path d="M4 6.2v11.6c0 1.77 3.58 3.2 8 3.2s8-1.43 8-3.2V6.2"/>
              <path d="M4 12c0 1.77 3.58 3.2 8 3.2s8-1.43 8-3.2"/>
            </svg>
          </span>
        </a>
        <button class="plat-rail__ico" type="button" data-inert-nav aria-label="Orders">
          <span class="plat-rail__tile">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 3.5h14v17l-2.3-1.6-2.35 1.6L12 19l-2.35 1.5L7.3 18.9 5 20.5Z"/>
              <path d="M9 8.5h6M9 12.5h6"/>
            </svg>
          </span>
        </button>
      </nav>

      <div class="plat-main">
        <div class="plat-topbar">
          <h1 class="plat-topbar__title" id="plat-page-title" tabindex="-1">Your credits</h1>

          <!-- The surface's single amber action, at the right-hand end of the
               dashboard topbar. Nothing else here carries fill.

               The mark is this build's own rakhi rosette - the same eight-petal
               form the Rakhi gift design draws across its hero - reduced to an
               icon and inheriting the button's own colour. It is the occasion
               reference: no extra hue, no illustration, no banner. It settles
               into place once on load and turns by exactly one petal on hover,
               which is a visible movement that leaves the form unchanged. -->
          <a class="plat-claim" href="#/app/claim" data-app-nav="app/claim">
            <svg class="plat-claim__mark" width="19" height="19" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
              <path d="M1.4 12c2.6-3.4 4.6 3 7.2-.4" stroke-width="1.5" opacity=".75"/>
              <path d="M22.6 12c-2.6-3.4-4.6 3-7.2-.4" stroke-width="1.5" opacity=".75"/>
              <g transform="translate(12 12)">
                <ellipse rx="2.3" ry="5.4" stroke-width="1.4" opacity=".55"/>
                <ellipse rx="2.3" ry="5.4" stroke-width="1.4" opacity=".55" transform="rotate(60)"/>
                <ellipse rx="2.3" ry="5.4" stroke-width="1.4" opacity=".55" transform="rotate(120)"/>
                <circle r="1.5" fill="currentColor" stroke="none"/>
              </g>
            </svg>
            Claim your Gift
          </a>
        </div>

        <div class="plat-view" id="plat-view"></div>
      </div>
    </div>

    <div id="app"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-mark">© 2026 MentorUnion</p>
      <nav class="footer-links" aria-label="Footer">
        <!-- The recipient's entry point: a gift card carries a code, not a link.
             Claiming happens inside the signed-in platform, so this goes there. -->
        <a href="#/app/claim">Claim a gift</a>
        <a href="#/" data-inert-nav>Terms</a>
        <a href="#/" data-inert-nav>Privacy</a>
        <a href="#/" data-inert-nav>Refund policy</a>
        <a href="#/" data-inert-nav>Contact</a>
      </nav>
    </div>
  </footer>

  <div id="live-region" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
